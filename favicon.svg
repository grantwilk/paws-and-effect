<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Paws and Effect">
  <!-- The badge is opaque, so the icon stays legible on any tab bar color even
       when the browser ignores the media query below. Both palettes are the
       light and dark red that the page itself uses for the today line. -->
  <style>
    .badge { fill: #C8102E }
    .paw   { fill: #F7F9F4 }
    @media (prefers-color-scheme: dark) {
      .badge { fill: #FF6072 }
      .paw   { fill: #17110F }
    }
  </style>
  <rect class="badge" width="32" height="32" rx="7"/>
  <g class="paw">
    <ellipse cx="16" cy="21.4" rx="6.3" ry="5.2"/>
    <ellipse cx="7.6" cy="14.3" rx="2.8" ry="3.5" transform="rotate(-22 7.6 14.3)"/>
    <ellipse cx="13.1" cy="9.8" rx="2.9" ry="3.8"/>
    <ellipse cx="18.9" cy="9.8" rx="2.9" ry="3.8"/>
    <ellipse cx="24.4" cy="14.3" rx="2.8" ry="3.5" transform="rotate(22 24.4 14.3)"/>
  </g>
</svg>
